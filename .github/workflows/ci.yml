name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2025-06-30

jobs:
  # --- Rust checks, split so a formatting nit can no longer gate the whole
  # --- build/test matrix (which is what silently disabled the aeon suite).
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add rustfmt --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add clippy --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (python + gpu bindings)
        run: cargo clippy --all-targets --features python,use-compiled-tools -- -D warnings
      - name: Clippy (matlab bindings)
        run: cargo clippy --lib --no-default-features --features matlab -- -D warnings

  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # The unit tests live in the binding-agnostic `core` module and are the
      # primary regression gate; they need neither the python nor the gpu build.
      - name: Run core unit tests
        run: cargo test --lib --no-default-features

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add llvm-tools --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate lcov coverage
        run: cargo llvm-cov --lib --no-default-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  linux:
    name: Wheel (linux) & correctness
    runs-on: ${{ matrix.platform.runner }}
    # No `needs: [lint]`: this job builds its own wheel, so a lint failure must
    # never be able to hide a correctness regression again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python${{ matrix.python-version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rustup-components: "rust-src rustc-dev llvm-tools"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist
      - name: Prepare test environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install --quiet numpy typeguard pytest pytest-cov aeon stumpy pycatch22
      - name: Install and test package
        run: |
          source .venv/bin/activate
          # Install the freshly built wheel only (deps are already present), so we
          # test exactly what was built rather than anything from PyPI.
          pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
          pytest -v --tb=short --require-oracles \
            --cov=tsdistances --cov-report=xml \
            tests/test_edge_cases.py \
            tests/test_python_bindings.py \
            tests/test_correctness_cpu.py \
            tests/test_correctness_banded.py \
            tests/test_correctness_catcheucl.py
      - name: Upload Python coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  macos:
    name: Wheel (macos) & correctness
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python${{ matrix.python-version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rustup-components: "rust-src rustc-dev llvm-tools"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist
      - name: Prepare test environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          pip install --quiet numpy typeguard pytest pytest-cov aeon stumpy pycatch22
      - name: Install and test package
        run: |
          source .venv/bin/activate
          pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
          pytest -v --tb=short --require-oracles \
            tests/test_edge_cases.py \
            tests/test_python_bindings.py \
            tests/test_correctness_cpu.py \
            tests/test_correctness_banded.py \
            tests/test_correctness_catcheucl.py

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [fmt, clippy, rust-test, linux, macos, sdist]
    timeout-minutes: 30
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
