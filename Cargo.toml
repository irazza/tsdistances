[workspace]
members = ["crates/tsdistances_gpu"]
# Pin bare `cargo build` / `cargo test` at the root to the tsdistances package.
# Cargo already defaults to the root package when the workspace root is itself a
# package, so this is belt-and-braces rather than a fix -- but the failure it
# guards against is expensive and silent: maturin builds the CPU-only Windows
# and aarch64 wheels with
#   --no-default-features --features python,pyo3/extension-module
# and if package selection ever widened to the whole workspace, that invocation
# dies with "the package 'tsdistances_gpu' does not contain these features".
# Building the GPU crate stays explicit, via `-p tsdistances_gpu`.
default-members = ["."]
resolver = "3"

[package]
name = "tsdistances"
version = "0.1.9"
description = "tsdistances is a Python library (with Rust backend) for computing various pairwise distances between sets of time series data."
edition = "2024"
authors = [
 "Alberto Azzari alberto.azzari@univr.it",
 "Andrea Cracco andrea.cracco@univr.it",
 "Francesco Masillo francesco.masillo@univr.it",
]

[dependencies]
catch22 = { git = "https://github.com/irazza/pycatch22-rs.git", package = "catch22" }
ctrlc = { version = "3.5", optional = true }
numpy = { version = "0.29", optional = true }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
rayon = "1.12"
rustfft = "6.4"
# vulkano is only needed by the GPU stack; gate it to the `gpu` feature so
# CPU-only builds (e.g. the Windows wheels) don't compile it.
vulkano = { version = "0.35.2", optional = true }
tsdistances_gpu = { path = "crates/tsdistances_gpu", version = "0.1.0", default-features = false, optional = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "tsdistances"

[profile.release]
lto = true
opt-level = 3
codegen-units = 16
strip = true

# Hoisted from crates/tsdistances_gpu, where cargo silently ignored them
# ("profiles for the non root package will be ignored"). rust-gpu's
# rustc_codegen_spirv backend and the shader build script are the dominant cost
# of a cold GPU build, and both are build-time artifacts -- compiling them
# unoptimized, as we were, is the single most expensive default here. This does
# apply to every build script and proc macro in the graph (syn, quote,
# pyo3-macros), which is a one-time cold-build cost that the shader speedup
# dwarfs.
[profile.release.build-override]
opt-level = 3
codegen-units = 16

[profile.dev.build-override]
opt-level = 3
debug = true

[features]
default = ["python", "gpu", "use-compiled-tools"]
gpu = ["dep:tsdistances_gpu", "dep:vulkano"]
python = ["pyo3", "ctrlc", "numpy"]
use-compiled-tools = [
    "gpu",
    "tsdistances_gpu/use-compiled-tools",
]
use-installed-tools = [
    "gpu",
    "tsdistances_gpu/use-installed-tools",
]
matlab = []
