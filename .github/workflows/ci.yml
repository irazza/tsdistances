name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Auto-cancel superseded runs for the same branch/PR so transient-outage
  # re-triggers don't pile up as stale "queued" runs. Never cancel tag/release
  # runs (those must complete to publish artifacts).
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: nightly-2026-05-22

jobs:
  # --- Rust checks, split so a formatting nit can no longer gate the whole
  # --- build/test matrix (which is what silently disabled the aeon suite).
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add rustfmt --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      # --all covers every workspace member, i.e. the GPU crate too. Before the
      # monorepo merge that crate had no CI of any kind and was never formatted.
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add clippy --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (python + gpu bindings)
        run: cargo clippy -p tsdistances --all-targets --features python,use-compiled-tools -- -D warnings
      - name: Clippy (matlab bindings)
        run: cargo clippy -p tsdistances --lib --no-default-features --features matlab -- -D warnings
      # The GPU crate itself: linting the root package does NOT lint workspace
      # members, so without an explicit -p this code stays unlinted (as it was
      # for its whole life in the separate repo). rust-src/rustc-dev/llvm-tools
      # are already installed above, which is what rust-gpu needs.
      - name: Clippy (gpu kernels)
        run: cargo clippy -p tsdistances_gpu --all-targets --features use-compiled-tools -- -D warnings

  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      # The unit tests live in the binding-agnostic `core` module and are the
      # primary regression gate; they need neither the python nor the gpu build.
      # Explicit -p so this can never widen into a workspace-wide build.
      - name: Run core unit tests
        run: cargo test -p tsdistances --lib --no-default-features
      # Compile-only gate for the GPU crate. Its tests call get_device() and
      # need a real Vulkan device, which stock GitHub runners do not have -- but
      # building them still catches the breakage that actually happens here
      # (rust-gpu/nightly drift, kernel signature changes). Running them for
      # real under lavapipe is a follow-up.
      - name: Build GPU crate and link its tests
        run: cargo test -p tsdistances_gpu --no-run --features use-compiled-tools
      # The one GPU-crate test suite that needs no device: it disassembles the SPIR-V
      # the build script just produced and asserts module-level invariants. This is the
      # gate that a green build is NOT: the rust-gpu 0.9 -> 0.10.0-alpha.1 bump compiled
      # and passed every test while silently emitting `GLSL.std.450 Pow` for `powi(2)`
      # (undefined for the negative bases DTW feeds it) and requiring an `Int64`
      # capability that locked the crate out of MoltenVK. Both are one assertion here.
      - name: Check compiled shader invariants
        run: cargo test -p tsdistances_gpu --features use-compiled-tools --test shader_invariants
      # CPU-vs-GPU parity, run against lavapipe (Mesa's software Vulkan device) so it works
      # on a runner with no GPU. This is not a nice-to-have: several wrong-answer bugs in
      # the wavefront reproduced *only* at lavapipe's subgroup width of 8 and were invisible
      # on a 64-wide AMD device, so a single-driver check would have missed them.
      - name: Install lavapipe (software Vulkan)
        # Deliberately no VK_ICD_FILENAMES: pinning it to a hard-coded path is how this
        # first failed -- if the file is not exactly there, the loader enumerates *no*
        # ICDs and `Instance::new` fails with VK_ERROR_INCOMPATIBLE_DRIVER, which reads
        # like "your Vulkan is too old" rather than "that path was wrong". A runner has
        # no other ICD installed, so plain enumeration finds lavapipe.
        #
        # `vulkaninfo --summary` is the gate: if no device is reachable, this step fails
        # with a readable driver listing instead of an opaque unwrap() panic three layers
        # into get_device().
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          ls -l /usr/share/vulkan/icd.d/
          vulkaninfo --summary
      - name: CPU/GPU parity (lavapipe)
        run: cargo test -p tsdistances --no-default-features --features use-compiled-tools --test cpu_gpu_parity

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup install ${{ env.RUST_TOOLCHAIN }}
          rustup component add llvm-tools --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate lcov coverage
        run: cargo llvm-cov -p tsdistances --lib --no-default-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  linux:
    name: Wheel (linux ${{ matrix.target }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # No `needs: [lint]`: this job builds its own wheel, so a lint failure must
    # never be able to hide a correctness regression again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # aarch64 is CPU-only: vulkano's X11/xcb deps aren't available in the
          # aarch64 cross sysroot (`cannot find -lxcb`). GPU wheels ship for the
          # native x86_64-linux and macOS legs.
          args: >-
            --release --out dist -i python${{ matrix.python-version }}
            ${{ matrix.target == 'aarch64' && '--no-default-features --features python,pyo3/extension-module' || '' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rustup-components: "rust-src rustc-dev llvm-tools"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist
      # Correctness runs only on the native x86_64 runner; the aarch64 wheel is
      # cross-built and can't be executed here.
      - name: Install and test package
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            # aeon/numba have no 3.14 support yet: build the wheel and smoke-test
            # the wrappers (no oracle suite).
            pip install --quiet numpy typeguard pytest
            pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
            pytest -v --tb=short tests/test_edge_cases.py tests/test_python_bindings.py
          else
            pip install --quiet numpy typeguard pytest pytest-cov aeon stumpy pycatch22
            pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
            pytest -v --tb=short --require-oracles --cov=tsdistances --cov-report=xml \
              tests/test_edge_cases.py tests/test_python_bindings.py \
              tests/test_correctness_cpu.py tests/test_correctness_banded.py \
              tests/test_correctness_catcheucl.py
          fi
      - name: Upload Python coverage
        if: matrix.target == 'x86_64' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  macos:
    name: Wheel (macos ${{ matrix.target }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships Apple Silicon (aarch64) only: GitHub's Intel macos-13
          # runners are scarce/retiring and chronically stall the queue.
          - { runner: macos-latest, target: aarch64, python-version: "3.12" }
          - { runner: macos-latest, target: aarch64, python-version: "3.13" }
          - { runner: macos-latest, target: aarch64, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python${{ matrix.python-version }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          rustup-components: "rust-src rustc-dev llvm-tools"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist
      - name: Install and test package
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          if [[ "${{ matrix.python-version }}" == "3.14" ]]; then
            pip install --quiet numpy typeguard pytest
            pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
            pytest -v --tb=short tests/test_edge_cases.py tests/test_python_bindings.py
          else
            pip install --quiet numpy typeguard pytest pytest-cov aeon stumpy pycatch22
            pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
            pytest -v --tb=short --require-oracles \
              tests/test_edge_cases.py tests/test_python_bindings.py \
              tests/test_correctness_cpu.py tests/test_correctness_banded.py \
              tests/test_correctness_catcheucl.py
          fi

  windows:
    name: Wheel (windows x86_64 CPU-only, py${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      # CPU-only: the gpu feature pulls rust-gpu's rustc_codegen_spirv, whose
      # link step exceeds Windows' 65535-object limit (LNK1189). Windows wheels
      # therefore ship without GPU support.
      # This stays true after the monorepo merge: tsdistances_gpu is an
      # `optional` dependency behind the `gpu` feature, and maturin builds the
      # root package only. Never add a bare `--workspace` to this job (or to the
      # aarch64 leg) -- it would drag the GPU crate in and reintroduce LNK1189.
      - name: Build wheels (CPU-only)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python${{ matrix.python-version }} --no-default-features --features python,pyo3/extension-module
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64-py${{ matrix.python-version }}
          path: dist
      - name: Install and smoke-test package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy typeguard pytest
          pip install tsdistances --no-index --find-links dist --force-reinstall --no-deps
          pytest -v --tb=short tests/test_edge_cases.py tests/test_python_bindings.py

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [fmt, clippy, rust-test, linux, macos, windows, sdist]
    timeout-minutes: 30
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
